plugins {
    id 'com.android.application'
}

import java.util.Properties

def versionProps = new Properties()
rootProject.file('version.properties').withInputStream { versionProps.load(it) }

android {
    namespace 'com.sktpj.npcbrain'
    compileSdk 36

    defaultConfig {
        applicationId 'com.sktpj.npcbrain'
        minSdk 23
        targetSdk 36
        versionCode versionProps.getProperty('VERSION_CODE').toInteger()
        versionName versionProps.getProperty('VERSION_NAME')
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
