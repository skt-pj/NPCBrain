name: v0.4.22 source patch

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-source:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Apply v0.4.22 source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected block once, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          demo = 'app/src/main/java/com/sktpj/npcbrain/DemoActivityV032.java'
          old = (
              "    private String firstNpcId(String roomId) {\n"
              "        if (DemoRuntimeV032.ROOM_NPC2.equals(roomId)) return \"npc2\";\n"
              "        return \"npc1\";\n"
              "    }\n"
          )
          new = (
              "    private String firstNpcId(String roomId) {\n"
              "        if (roomId != null && roomId.startsWith(\"direct_\")) {\n"
              "            String raw = roomId.substring(\"direct_\".length()).trim();\n"
              "            if (!raw.isEmpty()) {\n"
              "                try {\n"
              "                    String npcId = NpcId.of(raw).value();\n"
              "                    if (new NpcRegistryStore(this).activeNpcIds().contains(npcId)) return npcId;\n"
              "                } catch (Exception ignored) {\n"
              "                }\n"
              "            }\n"
              "        }\n"
              "        java.util.List<String> active = new NpcRegistryStore(this).activeNpcIds();\n"
              "        return active.isEmpty() ? \"npc1\" : active.get(0);\n"
              "    }\n"
          )
          replace_exact(demo, old, new)
          old = (
              "        liveDone = false;\n"
              "        initializeLiveStages();\n"
              "        liveNpcId = \"npc1\";\n"
              "        liveNpcName = demoRuntime.displayName(liveNpcId);\n"
              "        if (sendButton != null) sendButton.setEnabled(false);\n"
          )
          new = (
              "        liveDone = false;\n"
              "        initializeLiveStages();\n"
              "        liveNpcId = firstNpcId(null);\n"
              "        liveNpcName = demoRuntime.displayName(liveNpcId);\n"
              "        if (sendButton != null) sendButton.setEnabled(false);\n"
          )
          replace_exact(demo, old, new)

          runtime = 'app/src/main/java/com/sktpj/npcbrain/DemoRuntimeV032.java'
          old = (
              "                processSpontaneousGroupChain(\n"
              "                        sourceEventId,\n"
              "                        npcId,\n"
              "                        message,\n"
              "                        apiKey,\n"
              "                        effort,\n"
              "                        listener\n"
              "                );\n"
          )
          new = (
              "                processSpontaneousGroupChain(\n"
              "                        sourceEventId,\n"
              "                        npcId,\n"
              "                        targetId,\n"
              "                        message,\n"
              "                        apiKey,\n"
              "                        effort,\n"
              "                        listener\n"
              "                );\n"
          )
          replace_exact(runtime, old, new)
          old = (
              "    private void processSpontaneousGroupChain(\n"
              "            String sourceEventId,\n"
              "            String initialSenderId,\n"
              "            JSONObject initialMessage,\n"
              "            String apiKey,\n"
              "            String effort,\n"
              "            Listener listener\n"
              "    ) throws Exception {\n"
          )
          new = (
              "    private void processSpontaneousGroupChain(\n"
              "            String sourceEventId,\n"
              "            String initialSenderId,\n"
              "            String initialTargetId,\n"
              "            JSONObject initialMessage,\n"
              "            String apiKey,\n"
              "            String effort,\n"
              "            Listener listener\n"
              "    ) throws Exception {\n"
          )
          replace_exact(runtime, old, new)
          old = (
              "        while (SpontaneousMessagePolicy.canContinueGroupChain(generatedMessages)) {\n"
              "            List<String> activeNpcIds = npcRegistry.activeNpcIds();\n"
              "            String recipientId = SpontaneousMessagePolicy.nextNpc(senderId, activeNpcIds);\n"
              "            if (recipientId.isEmpty() || !activeNpcIds.contains(recipientId)) return;\n"
          )
          new = (
              "        while (SpontaneousMessagePolicy.canContinueGroupChain(generatedMessages)) {\n"
              "            List<String> activeNpcIds = npcRegistry.activeNpcIds();\n"
              "            String recipientId = generatedMessages == 1\n"
              "                    ? SpontaneousMessagePolicy.firstRecipient(\n"
              "                            initialSenderId, initialTargetId, activeNpcIds)\n"
              "                    : SpontaneousMessagePolicy.nextNpc(senderId, activeNpcIds);\n"
              "            if (recipientId.isEmpty() || !activeNpcIds.contains(recipientId)) return;\n"
          )
          replace_exact(runtime, old, new)

          codex = 'app/src/main/java/com/sktpj/npcbrain/CodexActivity.java'
          replace_exact(
              codex,
              "import android.widget.Button;\nimport android.widget.LinearLayout;\nimport android.widget.ScrollView;\n",
              "import android.widget.Button;\nimport android.widget.HorizontalScrollView;\nimport android.widget.LinearLayout;\nimport android.widget.ScrollView;\n"
          )
          old = (
              "        LinearLayout selector = new LinearLayout(this);\n"
              "        selector.setOrientation(LinearLayout.HORIZONTAL);\n"
              "        for (int i = 0; i < records.size(); i++) {\n"
              "            NpcArchiveStore.Record record = records.get(i);\n"
              "            Button button = archiveSelector(record);\n"
              "            LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(0, dp(52), 1f);\n"
              "            if (i > 0) params.leftMargin = dp(8);\n"
              "            selector.addView(button, params);\n"
              "        }\n"
              "        archiveContent.addView(selector);\n"
          )
          new = (
              "        HorizontalScrollView selectorScroll = new HorizontalScrollView(this);\n"
              "        selectorScroll.setHorizontalScrollBarEnabled(false);\n"
              "        LinearLayout selector = new LinearLayout(this);\n"
              "        selector.setOrientation(LinearLayout.HORIZONTAL);\n"
              "        selector.setPadding(0, 0, dp(4), 0);\n"
              "        for (int i = 0; i < records.size(); i++) {\n"
              "            NpcArchiveStore.Record record = records.get(i);\n"
              "            Button button = archiveSelector(record);\n"
              "            LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(dp(132), dp(52));\n"
              "            if (i > 0) params.leftMargin = dp(8);\n"
              "            selector.addView(button, params);\n"
              "        }\n"
              "        selectorScroll.addView(selector, new HorizontalScrollView.LayoutParams(\n"
              "                HorizontalScrollView.LayoutParams.WRAP_CONTENT,\n"
              "                HorizontalScrollView.LayoutParams.WRAP_CONTENT));\n"
              "        archiveContent.addView(selectorScroll);\n"
          )
          replace_exact(codex, old, new)
          PY

          git diff --check

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sktpj/npcbrain/DemoActivityV032.java \
                  app/src/main/java/com/sktpj/npcbrain/DemoRuntimeV032.java \
                  app/src/main/java/com/sktpj/npcbrain/CodexActivity.java
          git commit -m "Complete v0.4.22 dynamic NPC source fixes [skip ci]"
          git push origin HEAD:${{ github.head_ref }}
