name: v0.4.49 implementation patch

on:
  push:
    branches:
      - feature/v0.4.49-local-llm

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/v0.4.49-local-llm

      - name: Apply deterministic v0.4.49 patch
        run: python3 scripts/v049_patch.py

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Compile and run unit tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Remove temporary patch tooling and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/v049_patch.py .github/workflows/v049-autopatch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement v0.4.49 local LLM routing and OpenAI-only limits"
          git push origin HEAD:feature/v0.4.49-local-llm
