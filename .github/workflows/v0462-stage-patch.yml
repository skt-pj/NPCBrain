name: v0.4.62 diagnostic stage patch

on:
  push:
    branches:
      - feature/v0.4.62-brain-queue-grouping

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v0462-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Apply stage instrumentation patch
        run: python tools/v0462_patch.py

      - name: Verify tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Commit patched source and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/v0462_patch.py .github/workflows/v0462-stage-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "v0.4.62 record specialist stage details [v0462-patched]"
          git push
