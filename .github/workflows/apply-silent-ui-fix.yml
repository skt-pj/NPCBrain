name: Apply silent decision UI fix

on:
  push:
    branches:
      - fix/silent-decision-ui
    paths:
      - .github/workflows/apply-silent-ui-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/silent-decision-ui

      - name: Patch silent decision rendering
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/java/com/sktpj/npcbrain/DemoActivityV032.java")
          text = path.read_text()

          old_preview = '''        if (last == null) {
              preview.setText("まだ会話はありません");
          } else {
              preview.setText(last.optString("sender_name", "") + ": " + last.optString("text", ""));
          }
'''
          new_preview = '''        if (last == null) {
              preview.setText("まだ会話はありません");
          } else if (last.optString("sender_id", "").startsWith("decision_")) {
              preview.setText(last.optString("sender_name", "NPC（返信なし）"));
          } else {
              preview.setText(last.optString("sender_name", "") + ": " + last.optString("text", ""));
          }
'''
          if text.count(old_preview) != 1:
              raise SystemExit("room preview target not found exactly once")
          text = text.replace(old_preview, new_preview, 1)

          old_header = '''        boolean user = "user".equals(message.optString("sender_id"));
          JSONArray trace = message.optJSONArray("brain_trace");
          boolean hasTrace = trace != null && trace.length() > 0;

          LinearLayout wrapper = new LinearLayout(this);
          wrapper.setOrientation(LinearLayout.VERTICAL);
          wrapper.setGravity(user ? Gravity.END : Gravity.START);
          wrapper.setPadding(0, dp(4), 0, dp(4));

          if (!user) {
'''
          new_header = '''        String senderId = message.optString("sender_id", "");
          boolean user = "user".equals(senderId);
          boolean silentDecision = senderId.startsWith("decision_");
          JSONArray trace = message.optJSONArray("brain_trace");
          boolean hasTrace = trace != null && trace.length() > 0;

          LinearLayout wrapper = new LinearLayout(this);
          wrapper.setOrientation(LinearLayout.VERTICAL);
          wrapper.setGravity(user ? Gravity.END : Gravity.START);
          wrapper.setPadding(0, dp(4), 0, dp(4));

          if (silentDecision) {
              TextView silent = new TextView(this);
              silent.setText(message.optString("sender_name", "NPC（返信なし）"));
              silent.setTextColor(Color.rgb(92, 92, 102));
              silent.setTextSize(12);
              silent.setPadding(dp(4), dp(5), dp(4), dp(5));
              silent.setOnClickListener(v -> showMessageDetails(message));
              silent.setClickable(true);
              silent.setContentDescription("返信なしの脳内を見る");
              wrapper.addView(silent);
              return wrapper;
          }

          if (!user) {
'''
          if text.count(old_header) != 1:
              raise SystemExit("message rendering target not found exactly once")
          text = text.replace(old_header, new_header, 1)

          path.write_text(text)

          version = Path("version.properties")
          version.write_text("VERSION_NAME=0.4.0-hotfix1\nVERSION_CODE=11\n")

      - name: Verify patch
        run: |
          grep -F 'silentDecision = senderId.startsWith("decision_")' app/src/main/java/com/sktpj/npcbrain/DemoActivityV032.java
          grep -F 'preview.setText(last.optString("sender_name", "NPC（返信なし）"));' app/src/main/java/com/sktpj/npcbrain/DemoActivityV032.java
          grep -F 'VERSION_NAME=0.4.0-hotfix1' version.properties
          grep -F 'VERSION_CODE=11' version.properties
          if grep -F '返信しませんでした' app/src/main/java/com/sktpj/npcbrain/DemoActivityV032.java; then
            echo 'Unexpected visible silent-decision copy remains in activity' >&2
            exit 1
          fi

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/src/main/java/com/sktpj/npcbrain/DemoActivityV032.java version.properties
          git diff --cached --check
          git commit -m "Fix silent decision UI"
          git push origin HEAD:fix/silent-decision-ui
