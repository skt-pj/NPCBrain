name: v0.4.63 memory JSON fix

on:
  push:
    branches:
      - fix/v0.4.63-memory-json-truncation-final

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/v0.4.63-memory-json-truncation-final
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Apply patch
        run: python3 ci/v0463_memory_json_patch.py
      - name: Unit test and Debug compile
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit verified fix
        shell: bash
        run: |
          rm -f ci/v0463_memory_json_patch.py .github/workflows/v0463-memory-json-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.4.63 constrain local memory maintenance JSON"
          git push origin HEAD:fix/v0.4.63-memory-json-truncation-final
