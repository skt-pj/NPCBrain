name: Android CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ci-output/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'ci-output/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply v0.4.19 DungeonActivity context fix
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feature/v0.4.19-dungeon-roster' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/sktpj/npcbrain/DungeonActivity.java')
          text = path.read_text()
          old_traits = '''    private DungeonPersonalityPolicy.Traits traitsForNpc(String npcId) {
        Context app = getApplicationContext();
        Context context = "npc2".equals(npcId)
                ? new NpcStorageContext(app, "npc2") : app;
        CharacterStateStore character = new CharacterStateStore(context);
'''
          new_traits = '''    private DungeonPersonalityPolicy.Traits traitsForNpc(String npcId) {
        CharacterStateStore character = new CharacterStateStore(NpcContexts.storage(this, npcId));
'''
          old_current = '''    private CharacterStateStore currentCharacterStore() {
        Context app = getApplicationContext();
        Context context = "npc2".equals(selectedNpcId)
                ? new NpcStorageContext(app, "npc2") : app;
        return new CharacterStateStore(context);
    }
'''
          new_current = '''    private CharacterStateStore currentCharacterStore() {
        return new CharacterStateStore(NpcContexts.storage(this, selectedNpcId));
    }
'''
          changed = False
          if old_traits in text:
              text = text.replace(old_traits, new_traits)
              changed = True
          if old_current in text:
              text = text.replace(old_current, new_current)
              changed = True
          if changed:
              path.write_text(text)
          elif 'NpcContexts.storage(this, npcId)' not in text or 'NpcContexts.storage(this, selectedNpcId)' not in text:
              raise SystemExit('DungeonActivity source signature mismatch')
          Path('/tmp/v0419_changed').write_text('1' if changed else '0')
          PY
          if [ "$(cat /tmp/v0419_changed)" = "1" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/sktpj/npcbrain/DungeonActivity.java
            git commit -m "Fix dynamic NPC context in DungeonActivity [skip ci]"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Test and build release APK
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace

      - name: Sign and prepare artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          APK_SOURCE="app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_TARGET="NPCBrain-v${VERSION_NAME}-release.apk"

          curl -fsSL "https://raw.githubusercontent.com/skt-pj/2048TD/main/ci/2048td-release.jks.b64" -o skt-common-signing.jks.b64
          curl -fsSL "https://raw.githubusercontent.com/skt-pj/2048TD/main/app/build.gradle.kts" -o signing-source.gradle.kts
          base64 --decode skt-common-signing.jks.b64 > skt-common-signing.jks

          STORE_PASSWORD="$(sed -n 's/^[[:space:]]*storePassword = "\([^"]*\)"/\1/p' signing-source.gradle.kts | head -n1)"
          KEY_ALIAS="$(sed -n 's/^[[:space:]]*keyAlias = "\([^"]*\)"/\1/p' signing-source.gradle.kts | head -n1)"
          KEY_PASSWORD="$(sed -n 's/^[[:space:]]*keyPassword = "\([^"]*\)"/\1/p' signing-source.gradle.kts | head -n1)"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" sign \
            --ks skt-common-signing.jks \
            --ks-pass "pass:${STORE_PASSWORD}" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "$APK_TARGET" \
            "$APK_SOURCE"

          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_TARGET" | tee signing-certificate.txt
          sha256sum "$APK_TARGET" > "${APK_TARGET}.sha256"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "versionName=${VERSION_NAME}"
            echo "versionCode=${VERSION_CODE}"
            echo "run=${GITHUB_RUN_ID}"
            echo "build=testDebugUnitTest,assembleRelease,apksigner"
          } > build-metadata.txt
          rm -f skt-common-signing.jks skt-common-signing.jks.b64 signing-source.gradle.kts
          echo "name=NPCBrain-v${VERSION_NAME}-release" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            NPCBrain-v*-release.apk
            NPCBrain-v*-release.apk.sha256
            signing-certificate.txt
            build-metadata.txt
          if-no-files-found: error

      - name: Record CI result
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          VERSION_NAME: ${{ steps.artifact.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p ci-output
          RESULT_FILE="ci-output/run-${GITHUB_RUN_ID}.txt"
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "status=${JOB_STATUS}"
            echo "job_commit=${GITHUB_SHA}"
            echo "artifact_id=${ARTIFACT_ID}"
            echo "artifact_name=${ARTIFACT_NAME}"
            echo "versionName=${VERSION_NAME}"
          } > "$RESULT_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_FILE"
          git commit -m "Record Android CI run ${GITHUB_RUN_ID} [skip ci]"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1
