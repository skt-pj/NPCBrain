name: Android Debug APK

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-provider: basic

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Prepare debug artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(grep '^VERSION_NAME=' version.properties | cut -d= -f2)"
          VERSION_CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          APK_SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          mkdir -p dist
          APK_TARGET="dist/NPCBrain-${VERSION_NAME}-debug.apk"
          cp "$APK_SOURCE" "$APK_TARGET"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_TARGET" | tee dist/debug-signing-certificate.txt
          sha256sum "$APK_TARGET" > "${APK_TARGET}.sha256"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "versionName=${VERSION_NAME}"
            echo "versionCode=${VERSION_CODE}"
            echo "run=${GITHUB_RUN_ID}"
            echo "build=testDebugUnitTest,assembleDebug"
            echo "variant=debug"
          } > dist/debug-build-metadata.txt

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NPCBrain-debug
          path: |
            dist/NPCBrain-*-debug.apk
            dist/NPCBrain-*-debug.apk.sha256
            dist/debug-signing-certificate.txt
            dist/debug-build-metadata.txt
          if-no-files-found: error
          retention-days: 7
