name: v0.4.58 context-window patch

on:
  push:
    branches:
      - feature/v0.4.58-local-context-budget

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4.58-local-context-budget
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply deterministic patch
        run: python3 tools/v0458_context_fix.py
      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit verified source and remove temporary patch files
        run: |
          rm -f tools/v0458_context_fix.py .github/workflows/v0458-context-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.4.58 fix local 4096-token overflow"
          git push origin HEAD:feature/v0.4.58-local-context-budget
