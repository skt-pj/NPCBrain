name: v0.4.59 local JSON patch

on:
  push:
    branches:
      - feature/v0.4.59-local-json-constraint

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[v0459-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v0.4.59-local-json-constraint
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Apply deterministic patch
        run: python3 tools/v0459_apply.py
      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Commit verified source and remove temporary patch files
        run: |
          rm -f tools/v0459_apply.py .github/workflows/v0459-local-json-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'v0.4.59 constrain local JSON generation [v0459-patched]'
          git push origin HEAD:feature/v0.4.59-local-json-constraint
