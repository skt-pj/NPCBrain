name: Patch dungeon readability once

on:
  push:
    branches:
      - feature/v0.4.35-dungeon-walk-sprite
    paths:
      - .github/workflows/patch-dungeon-readability-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/v0.4.35-dungeon-walk-sprite
      - name: Patch board palette usage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/sktpj/npcbrain/DungeonBoardView.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              ('paint.setColor(Color.rgb(5, 9, 15));',
               'paint.setColor(DungeonBoardPalette.UNEXPLORED_FILL);'),
              ('paint.setColor(Color.rgb(10, 17, 26));',
               'paint.setColor(DungeonBoardPalette.UNEXPLORED_MARK);'),
              ('paint.setColor(visible ? Color.rgb(54, 68, 84) : Color.rgb(30, 39, 51));',
               'paint.setColor(DungeonBoardPalette.wallBody(visible));'),
              ('paint.setColor(visible ? Color.rgb(78, 96, 116) : Color.rgb(43, 54, 68));',
               'paint.setColor(DungeonBoardPalette.wallTop(visible));'),
              ('paint.setColor(Color.rgb(18, 27, 38));',
               'paint.setColor(DungeonBoardPalette.wallBottom(visible));'),
              ('paint.setColor(visible ? Color.rgb(59, 68, 77) : Color.rgb(35, 42, 50));',
               'paint.setColor(DungeonBoardPalette.floorBorder(visible));'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence of {old!r}, found {count}')
              text = text.replace(old, new, 1)

          old_floor = '''            int base = ((x + y) & 1) == 0 ? 45 : 49;\n            if (!visible) base -= 18;\n            paint.setColor(Color.rgb(base, base + 5, base + 9));\n'''
          new_floor = '''            paint.setColor(DungeonBoardPalette.floorFill(visible, x, y));\n'''
          if text.count(old_floor) != 1:
              raise SystemExit(f'expected one legacy floor block, found {text.count(old_floor)}')
          text = text.replace(old_floor, new_floor, 1)

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/patch-dungeon-readability-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/sktpj/npcbrain/DungeonBoardView.java .github/workflows/patch-dungeon-readability-once.yml
          git commit -m "Improve dungeon sprite background readability"
          git push origin HEAD:feature/v0.4.35-dungeon-walk-sprite
